[project]
name = "redtape-decoder"
version = "0.1.0"
description = ""
authors = [
    {name = "Nargiza Imasheva",email = "imnaur@bk.ru"}
]
package-mode = false
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pytest (>=9.1.1,<10.0.0)",
    "openai (>=2.52.0,<3.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.0,<0.53.0)",
    "streamlit (>=1.61.1,<2.0.0)",
    "pypdf (>=6.15.0,<7.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "pydantic (>=2.13.4,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
black = "^26.5.1"
isort = "^8.0.1"
flake8 = "^7.3.0"
mypy = "^2.3.1"

[tool.black]
line-length = 116
target-version = ['py313']
